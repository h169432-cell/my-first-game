name: Diagnose historical suspect 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-historical-suspect4.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose historical WebP sources
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess

          commit = '923a718c386dfebf9c3753bb6cf6e5d686eb7e18'
          outdir = Path('.work/candidates')
          outdir.mkdir(parents=True, exist_ok=True)
          lines = []

          blob_path = 'assets/suspects-latest.webp'
          blob = subprocess.check_output(['git', 'show', f'{commit}:{blob_path}'])
          lines += [
              f'historical_blob_path={blob_path}',
              f'historical_blob_bytes={len(blob)}',
              f'historical_blob_sha256={hashlib.sha256(blob).hexdigest()}',
              f'historical_blob_header={blob[:12].hex()}',
          ]
          if len(blob) >= 12 and blob[:4] == b'RIFF' and blob[8:12] == b'WEBP':
              declared = int.from_bytes(blob[4:8], 'little') + 8
              lines.append(f'historical_blob_declared_bytes={declared}')
              lines.append(f'historical_blob_size_match={declared == len(blob)}')

          parts = []
          for i in range(1, 5):
              path = f'assets/new-suspect-grid-part{i}.js'
              text = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8')
              matches = re.findall(r"\.push\('([^']+)'\)", text)
              lines.append(f'part{i}_push_count={len(matches)}')
              lines.append(f'part{i}_payload_chars={sum(len(x) for x in matches)}')
              parts.extend(matches)

          payload = ''.join(parts)
          payload += '=' * (-len(payload) % 4)
          decoded = base64.b64decode(payload)
          lines += [
              f'parts_total_payload_chars={len(payload)}',
              f'parts_decoded_bytes={len(decoded)}',
              f'parts_decoded_sha256={hashlib.sha256(decoded).hexdigest()}',
              f'parts_decoded_header={decoded[:12].hex()}',
          ]
          if len(decoded) >= 12 and decoded[:4] == b'RIFF' and decoded[8:12] == b'WEBP':
              declared = int.from_bytes(decoded[4:8], 'little') + 8
              lines.append(f'parts_declared_bytes={declared}')
              lines.append(f'parts_size_match={declared == len(decoded)}')
          lines.append(f'parts_equal_historical_blob={decoded == blob}')

          meta = outdir / 'historical-suspect-grid-diagnostics.txt'
          meta.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          print(meta.read_text())
          PY

      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .work/candidates/historical-suspect-grid-diagnostics.txt
          if git diff --cached --quiet; then
            echo "No diagnostics changes"
          else
            git commit -m "Record historical suspect grid diagnostics"
            git push
          fi
