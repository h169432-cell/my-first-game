name: Recover historical suspect 4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/extract-historical-suspect4.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Recover and extract historical suspect 4
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, re, subprocess

          commit = '923a718c386dfebf9c3753bb6cf6e5d686eb7e18'
          parts = []
          for i in range(1, 5):
              path = f'assets/new-suspect-grid-part{i}.js'
              text = subprocess.check_output(['git', 'show', f'{commit}:{path}']).decode('utf-8')
              m = re.search(r"\.push\('([^']+)'\)", text)
              if not m:
                  raise RuntimeError(f'No payload in {path}')
              parts.append(m.group(1))

          payload = ''.join(parts)
          payload += '=' * (-len(payload) % 4)
          raw = base64.b64decode(payload)
          if raw[:4] != b'RIFF' or raw[8:12] != b'WEBP':
              raise RuntimeError('Not RIFF/WebP')
          declared = int.from_bytes(raw[4:8], 'little') + 8
          if declared - len(raw) != 1:
              raise RuntimeError(f'Expected exactly one missing byte; declared={declared} actual={len(raw)}')

          attempts = []
          recovered = None
          recovered_suffix = None
          # The only missing data is the final byte. Try all 256 values and accept only a uniquely decodable image.
          for value in range(256):
              candidate = raw + bytes([value])
              try:
                  image = Image.open(io.BytesIO(candidate))
                  image.load()
                  attempts.append((value, image.size, image.mode))
                  if recovered is None:
                      recovered = candidate
                      recovered_suffix = value
                  else:
                      raise RuntimeError(f'Multiple final-byte values decode: {attempts}')
              except RuntimeError:
                  raise
              except Exception:
                  pass

          if recovered is None:
              raise RuntimeError('No final-byte value produced a decodable WebP')

          image = Image.open(io.BytesIO(recovered)).convert('RGB')
          w, h = image.size
          # Historical CSS is a four-column / two-row sheet. Suspect 4 is top-right.
          left, top, right, bottom = round(w * 3 / 4), 0, w, round(h / 2)
          crop = image.crop((left, top, right, bottom))

          outdir = Path('.work/candidates')
          outdir.mkdir(parents=True, exist_ok=True)
          out = outdir / 'suspect-4-history.jpg'
          crop.save(out, 'JPEG', quality=95, optimize=True)
          outdata = out.read_bytes()
          meta = outdir / 'suspect-4-history.txt'
          meta.write_text(
              f'source_commit={commit}\n'
              f'source_parts=assets/new-suspect-grid-part1.js..part4.js\n'
              f'recovered_final_byte={recovered_suffix}\n'
              f'recovered_webp_bytes={len(recovered)}\n'
              f'recovered_webp_sha256={hashlib.sha256(recovered).hexdigest()}\n'
              f'recovered_dimensions={w}x{h}\n'
              f'crop_box={left},{top},{right},{bottom}\n'
              f'candidate_dimensions={crop.width}x{crop.height}\n'
              f'candidate_bytes={len(outdata)}\n'
              f'candidate_sha256={hashlib.sha256(outdata).hexdigest()}\n'
              f'unique_decodable_suffix_count={len(attempts)}\n',
              encoding='utf-8'
          )
          print(meta.read_text())
          PY

      - name: Commit isolated recovered candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .work/candidates/suspect-4-history.jpg .work/candidates/suspect-4-history.txt
          if git diff --cached --quiet; then
            echo "No candidate changes"
          else
            git commit -m "Recover historical suspect-4 candidate"
            git push
          fi
