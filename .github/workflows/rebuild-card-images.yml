name: Finalize card assets

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebuild-card-images.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python -m pip install --quiet pillow

      - name: Build individual card images
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, io, re, shutil

          assets = Path('assets')
          cards = assets / 'cards'
          shutil.rmtree(cards, ignore_errors=True)
          cards.mkdir(parents=True, exist_ok=True)

          def rebuild(pattern):
              pieces = []
              for path in sorted(assets.glob(pattern)):
                  text = path.read_text(encoding='utf-8')
                  m = re.search(r"\.push\('([^']+)'\)", text)
                  if not m:
                      raise RuntimeError(f'Could not parse {path}')
                  pieces.append(m.group(1))
              if len(pieces) != 4:
                  raise RuntimeError(f'{pattern}: expected 4 parts, found {len(pieces)}')
              return base64.b64decode(''.join(pieces))

          suspect_sheet = Image.open(io.BytesIO(rebuild('new-suspect-grid-part*.js'))).convert('RGB')
          evidence_sheet = Image.open(io.BytesIO(rebuild('new-evidence-grid-part*.js'))).convert('RGB')

          def scaled_box(box, image):
              x1, y1, x2, y2 = box
              sx = image.width / 540
              sy = image.height / 405
              return tuple(round(v * (sx if i % 2 == 0 else sy)) for i, v in enumerate(box))

          suspect_boxes = {
              1:(4,3,134,200), 2:(137,3,267,200), 3:(270,3,400,200), 4:(403,3,537,200),
              5:(67,205,200,402), 6:(203,205,334,402), 7:(337,205,469,402),
          }
          for n, box in suspect_boxes.items():
              suspect_sheet.crop(scaled_box(box, suspect_sheet)).save(
                  cards / f'suspect-{n}.jpg', 'JPEG', quality=90, optimize=True
              )

          evidence_boxes = {
              'motive':(9,3,184,217),
              'clue':(190,3,365,217),
              'weapon':(370,3,540,217),
              'false-testimony':(9,220,184,405),
              'alibi-vertical':(190,220,365,405),
              'twist':(370,220,540,405),
          }
          for name, box in evidence_boxes.items():
              evidence_sheet.crop(scaled_box(box, evidence_sheet)).save(
                  cards / f'{name}.jpg', 'JPEG', quality=90, optimize=True
              )

          old_ui = (assets / 'evidence-ui.js').read_text(encoding='utf-8')
          m = re.search(r"HORIZONTAL_ALIBI\s*=\s*'data:image/jpeg;base64,([^']+)'", old_ui)
          if not m:
              raise RuntimeError('Could not extract the horizontal alibi image')
          horizontal = Image.open(io.BytesIO(base64.b64decode(m.group(1)))).convert('RGB')
          horizontal.save(cards / 'alibi-horizontal.jpg', 'JPEG', quality=90, optimize=True)

          print('Generated cards:')
          for p in sorted(cards.glob('*.jpg')):
              print(p, p.stat().st_size)
          PY

      - name: Replace artwork UI with direct image references
        run: |
          cat > assets/suspect-ui.js <<'JS'
          (() => {
            const NAMES = {
              1: 'ファン・ゴッホ',
              2: 'レオナルド・ダ・ヴィンチ',
              3: 'フェルメール',
              4: '織田信長',
              5: 'ラファエロ',
              6: 'モネ',
              7: 'ヤン・ファン・エイク',
            };
            const srcFor = (n) => `assets/cards/suspect-${n}.jpg`;

            const style = document.createElement('style');
            style.textContent = `
              .card.suspect-image-card{padding:0;overflow:hidden;background:#090b0f;border-color:#806633}
              .card.suspect-image-card:hover{border-color:#d1ad59}
              .card-art-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#090b0f;display:block}
              .private-card.has-card-art{padding:14px;background:#111722;color:#f4f0e7;max-width:340px}
              .private-card.has-card-art>.icon{display:none}
              .private-card-art{display:block;width:min(300px,100%);max-height:440px;object-fit:contain;margin:0 auto 12px;border-radius:12px;border:1px solid #8e7446;background:#090b0f}
              .accuse-grid button.suspect-choice{padding:5px;display:grid;gap:5px;background:#171d28;border:1px solid #39465c}
              .accuse-thumb{display:block;width:100%;aspect-ratio:3/4;object-fit:contain;border-radius:7px;background:#090b0f}
              .accuse-name{font-size:.62rem;line-height:1.15;color:#e6d4a4}
            `;
            document.head.appendChild(style);

            function addPawnMarker(btn, index) {
              const pawns = pawnOwnersAt(index);
              if (!pawns.length) return;
              const marker = document.createElement('span');
              marker.style.cssText = 'position:absolute;right:5px;top:5px;z-index:5;padding:3px 6px;border-radius:999px;background:#f1d58a;color:#111;font-size:11px;font-weight:800;box-shadow:0 2px 5px #0008';
              marker.textContent = pawns.map((p) => `P${p + 1}`).join(' ');
              btn.appendChild(marker);
            }

            function decorateBoard() {
              const buttons = document.querySelectorAll('#board .card');
              state.board.forEach((card, index) => {
                const btn = buttons[index];
                if (!btn || !card.revealed || card.type !== 'suspect') return;
                const n = card.suspectNumber;
                if (n < 1 || n > 7) return;
                btn.classList.add('suspect-image-card');
                btn.innerHTML = '';
                const img = document.createElement('img');
                img.className = 'card-art-img';
                img.src = srcFor(n);
                img.alt = `容疑者 ${n} ${NAMES[n]}`;
                img.draggable = false;
                btn.appendChild(img);
                addPawnMarker(btn, index);
              });
            }

            const baseRenderBoard = renderBoard;
            renderBoard = function renderBoardWithSuspectArtwork() {
              baseRenderBoard();
              decorateBoard();
            };

            function enhanceModal() {
              const privateCard = document.querySelector('.private-card:not([data-suspect-art])');
              if (privateCard && state.selectedIndex !== null) {
                const card = state.board[state.selectedIndex];
                if (card?.type === 'suspect' && card.suspectNumber >= 1 && card.suspectNumber <= 7) {
                  const n = card.suspectNumber;
                  privateCard.dataset.suspectArt = '1';
                  privateCard.classList.add('has-card-art');
                  const img = document.createElement('img');
                  img.className = 'private-card-art';
                  img.src = srcFor(n);
                  img.alt = `容疑者 ${n} ${NAMES[n]}`;
                  privateCard.prepend(img);
                }
              }

              document.querySelectorAll('[data-accuse]').forEach((button) => {
                const n = Number(button.dataset.accuse);
                if (!Number.isInteger(n) || n < 1 || n > 7 || button.dataset.suspectArt) return;
                button.dataset.suspectArt = '1';
                button.classList.add('suspect-choice');
                button.innerHTML = '';
                const img = document.createElement('img');
                img.className = 'accuse-thumb';
                img.src = srcFor(n);
                img.alt = `容疑者 ${n} ${NAMES[n]}`;
                const number = document.createElement('span');
                number.textContent = `容疑者 ${n}`;
                const name = document.createElement('span');
                name.className = 'accuse-name';
                name.textContent = NAMES[n];
                button.append(img, number, name);
              });
            }

            for (let n = 1; n <= 7; n += 1) {
              const img = new Image();
              img.src = srcFor(n);
            }
            new MutationObserver(enhanceModal).observe($('modalContent'), { childList: true, subtree: true });
          })();
          JS

          cat > assets/evidence-ui.js <<'JS'
          (() => {
            const IMAGES = {
              motive: 'assets/cards/motive.jpg',
              clue: 'assets/cards/clue.jpg',
              weapon: 'assets/cards/weapon.jpg',
              falseTestimony: 'assets/cards/false-testimony.jpg',
              alibiVertical: 'assets/cards/alibi-vertical.jpg',
              alibiHorizontal: 'assets/cards/alibi-horizontal.jpg',
              twist: 'assets/cards/twist.jpg',
            };

            const style = document.createElement('style');
            style.textContent = `
              .card.evidence-image-card{padding:0;overflow:hidden;background:#090b0f;border-color:#806633}
              .card.evidence-image-card:hover{border-color:#d1ad59}
              .evidence-card-img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#090b0f;display:block}
              .private-card.has-evidence-art{padding:14px;background:#111722;color:#f4f0e7;max-width:340px}
              .private-card.has-evidence-art>.icon{display:none}
              .private-evidence-img{display:block;width:min(300px,100%);max-height:440px;object-fit:contain;margin:0 auto 12px;border-radius:12px;border:1px solid #8e7446;background:#090b0f}
            `;
            document.head.appendChild(style);

            function imageFor(card) {
              if (!card) return '';
              if (card.type === 'motive') return IMAGES.motive;
              if (card.type === 'clue') return IMAGES.clue;
              if (card.type === 'weapon') return IMAGES.weapon;
              if (card.type === 'falseTestimony') return IMAGES.falseTestimony;
              if (card.type === 'twist') return IMAGES.twist;
              if (card.type === 'alibi') {
                return card.variant === 'alibi-horizontal' ? IMAGES.alibiHorizontal : IMAGES.alibiVertical;
              }
              return '';
            }

            function addPawnMarker(btn, index) {
              const pawns = pawnOwnersAt(index);
              if (!pawns.length) return;
              const marker = document.createElement('span');
              marker.style.cssText = 'position:absolute;right:5px;top:5px;z-index:5;padding:3px 6px;border-radius:999px;background:#f1d58a;color:#111;font-size:11px;font-weight:800;box-shadow:0 2px 5px #0008';
              marker.textContent = pawns.map((p) => `P${p + 1}`).join(' ');
              btn.appendChild(marker);
            }

            function decorateBoard() {
              const buttons = document.querySelectorAll('#board .card');
              state.board.forEach((card, index) => {
                if (!card.revealed || card.type === 'suspect') return;
                const btn = buttons[index];
                const src = imageFor(card);
                if (!btn || !src) return;
                btn.classList.add('evidence-image-card');
                btn.innerHTML = '';
                const img = document.createElement('img');
                img.className = 'evidence-card-img';
                img.src = src;
                img.alt = labelFor(card);
                img.draggable = false;
                btn.appendChild(img);
                addPawnMarker(btn, index);
              });
            }

            const baseRenderBoard = renderBoard;
            renderBoard = function renderBoardWithEvidenceArtwork() {
              baseRenderBoard();
              decorateBoard();
            };

            function enhanceModal() {
              const privateCard = document.querySelector('.private-card:not([data-evidence-art])');
              if (!privateCard || state.selectedIndex === null) return;
              const card = state.board[state.selectedIndex];
              if (!card || card.type === 'suspect') return;
              const src = imageFor(card);
              if (!src) return;
              privateCard.dataset.evidenceArt = '1';
              privateCard.classList.add('has-evidence-art');
              const img = document.createElement('img');
              img.className = 'private-evidence-img';
              img.src = src;
              img.alt = labelFor(card);
              img.draggable = false;
              privateCard.prepend(img);
            }

            Object.values(IMAGES).forEach((src) => {
              const img = new Image();
              img.src = src;
            });
            new MutationObserver(enhanceModal).observe($('modalContent'), { childList: true, subtree: true });
          })();
          JS

      - name: Simplify index script loading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = text.index('  <script src="assets/new-suspect-grid-part1.js')
          end = text.index('</body>')
          scripts = '''  <script src="game.js?v=20260825-2147"></script>\n  <script src="assets/suspect-ui.js?v=20260825-2147"></script>\n  <script src="assets/evidence-ui.js?v=20260825-2147"></script>\n'''
          text = text[:start] + scripts + text[end:]
          text = text.replace('style.css?v=20260825-2125', 'style.css?v=20260825-2147')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Remove legacy artwork systems
        run: |
          rm -f assets/card-image-runtime.js
          rm -f assets/image-blob-fix.js
          rm -f assets/new-suspect-grid-part*.js
          rm -f assets/new-evidence-grid-part*.js
          rm -f assets/suspect-sheet-part*.js
          rm -f assets/suspects-latest.webp assets/suspects-final.webp
          rm -f assets/evidence-final.webp assets/evidence-art-sprite.webp assets/evidence-cards-sheet.webp
          rm -f assets/evidence-card-data-part1.js assets/evidence-card-map.js
          rm -rf assets/cards-data assets/evidence-hq assets/evidence-pack assets/hq-cards
          rm -f assets/clueverge-rules-v2.js
          rm -f .github/workflows/rebuild-card-images.yml

      - name: Validate final structure
        run: |
          test -f index.html
          test -f game.js
          test -f style.css
          test -f assets/suspect-ui.js
          test -f assets/evidence-ui.js
          for f in \
            suspect-1.jpg suspect-2.jpg suspect-3.jpg suspect-4.jpg suspect-5.jpg suspect-6.jpg suspect-7.jpg \
            motive.jpg clue.jpg weapon.jpg false-testimony.jpg alibi-vertical.jpg alibi-horizontal.jpg twist.jpg; do
            test -s "assets/cards/$f" || { echo "Missing assets/cards/$f"; exit 1; }
          done
          echo 'Final files:'
          find assets -maxdepth 2 -type f | sort

      - name: Commit cleaned structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Simplify card assets to individual image files"
          git push
