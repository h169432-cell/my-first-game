name: Reconstruct staged card images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconstruct-staged-card.yml'
      - '.work/staging/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct complete staged images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/cards

          verify_and_store() {
            output_name="$1"
            expected_size="$2"
            expected_sha="$3"
            shift 3
            parts=("$@")
            for p in "${parts[@]}"; do
              if [ ! -f "$p" ]; then
                echo "$output_name: staging incomplete; skipping"
                return 0
              fi
            done
            tmp="$(mktemp)"
            cat "${parts[@]}" | base64 --decode > "$tmp"
            actual_size="$(wc -c < "$tmp" | tr -d ' ')"
            actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
            echo "$output_name: candidate size=$actual_size sha256=$actual_sha expected_size=$expected_size expected_sha=$expected_sha"
            test "$actual_size" = "$expected_size"
            test "$actual_sha" = "$expected_sha"
            test "$(xxd -p -l 2 "$tmp")" = "ffd8"
            test "$(tail -c 2 "$tmp" | xxd -p)" = "ffd9"
            mv "$tmp" "assets/cards/${output_name}"
            echo "$output_name: verified size=$actual_size sha256=$actual_sha"
          }

          verify_and_store 'alibi-vertical.jpg' 7154 '5e03cf0f4919414cdbc393a9f6afe3149f3e04527a64a300f7fb708c0333ae17' \
            .work/staging/alibi-vertical.part1.b64 .work/staging/alibi-vertical.part2.b64 \
            .work/staging/alibi-vertical.part3.b64 .work/staging/alibi-vertical.part4.b64

          verify_and_store 'alibi-horizontal.jpg' 20408 'fadb23b8d690f307a970b628424953d6904d4610c87fae52b9577cf3055a9749' \
            .work/staging/alibi-horizontal.part1a.b64 .work/staging/alibi-horizontal.part1b.b64 \
            .work/staging/alibi-horizontal.part2a.b64 .work/staging/alibi-horizontal.part2b.b64 \
            .work/staging/alibi-horizontal.part3.b64 .work/staging/alibi-horizontal.part4.b64 \
            .work/staging/alibi-horizontal.part5.b64 .work/staging/alibi-horizontal.part6.b64 \
            .work/staging/alibi-horizontal.part7.b64 .work/staging/alibi-horizontal.part8.b64 \
            .work/staging/alibi-horizontal.part9.b64 .work/staging/alibi-horizontal.part10.b64

          verify_and_store 'twist.jpg' 7145 '85b2e191667320e4208f674b0930a71fe985a27b3c680a4dfc6cd7db2d60ebbb' \
            .work/staging/twist.part1.b64 .work/staging/twist.part2.b64

          verify_and_store 'suspect-4.jpg' 28572 'ca91f54930b75071432c21844b3fb7353d2527322d89279559abf01a116de808' \
            .work/staging/suspect-4.part1a.b64 .work/staging/suspect-4.part1b.b64 \
            .work/staging/suspect-4.part1c.b64 .work/staging/suspect-4.part1d.b64 \
            .work/staging/suspect-4.part1e.b64 .work/staging/suspect-4.part1f.b64 \
            .work/staging/suspect-4.part1g.b64 .work/staging/suspect-4.part2.b64 \
            .work/staging/suspect-4.part3.b64 .work/staging/suspect-4.part4.b64

      - name: Commit verified images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in assets/cards/alibi-vertical.jpg assets/cards/alibi-horizontal.jpg assets/cards/twist.jpg assets/cards/suspect-4.jpg; do
            if [ -f "$p" ]; then
              git add "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo "No verified image changes"
            exit 0
          fi
          git commit -m "Add verified staged card images"
          git push
