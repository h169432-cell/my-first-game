name: Reconstruct staged card images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/reconstruct-staged-card.yml'
      - '.work/staging/**'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct complete staged images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/cards

          rebuild_if_complete() {
            output_name="$1"
            stage_prefix="$2"
            count="$3"
            expected_size="$4"
            expected_sha="$5"
            parts=()
            for i in $(seq 1 "$count"); do
              p=".work/staging/${stage_prefix}.part${i}.b64"
              if [ ! -f "$p" ]; then
                echo "$output_name: staging incomplete; skipping"
                return 0
              fi
              parts+=("$p")
            done

            tmp="$(mktemp)"
            cat "${parts[@]}" | base64 --decode > "$tmp"
            actual_size="$(wc -c < "$tmp" | tr -d ' ')"
            actual_sha="$(sha256sum "$tmp" | awk '{print $1}')"
            test "$actual_size" = "$expected_size"
            test "$actual_sha" = "$expected_sha"
            test "$(xxd -p -l 2 "$tmp")" = "ffd8"
            test "$(tail -c 2 "$tmp" | xxd -p)" = "ffd9"
            mv "$tmp" "assets/cards/${output_name}"
            echo "$output_name: verified size=$actual_size sha256=$actual_sha"
          }

          rebuild_if_complete 'alibi-vertical.jpg' 'alibi-vertical' 2 7154 '5e03cf0f4919414cdbc393a9f6afe3149f3e04527a64a300f7fb708c0333ae17'
          rebuild_if_complete 'alibi-horizontal.jpg' 'alibi-horizontal' 5 20408 'fadb23b8d690f307a970b628424953d6904d4610c87fae52b9577cf3055a9749'
          rebuild_if_complete 'twist.jpg' 'twist' 2 7145 '85b2e191667320e4208f674b0930a71fe985a27b3c680a4dfc6cd7db2d60ebbb'

      - name: Commit verified images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for p in assets/cards/alibi-vertical.jpg assets/cards/alibi-horizontal.jpg assets/cards/twist.jpg; do
            if [ -f "$p" ]; then
              git add "$p"
            fi
          done
          if git diff --cached --quiet; then
            echo "No verified image changes"
            exit 0
          fi
          git commit -m "Add verified staged card images"
          git push
