name: Recover suspect 4 at Base64 boundary

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/recover-suspect4-boundary.yml'

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python -m pip install --quiet pillow
      - name: Test part1 boundary insertion
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64, hashlib, io, re, string, subprocess

          commit='923a718c386dfebf9c3753bb6cf6e5d686eb7e18'
          parts=[]
          for i in range(1,5):
              text=subprocess.check_output(['git','show',f'{commit}:assets/new-suspect-grid-part{i}.js']).decode()
              parts.append(re.search(r"\.push\('([^']+)'\)",text).group(1))
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/'
          good=[]
          for ch in alphabet:
              payload=parts[0]+ch+''.join(parts[1:])
              raw=base64.b64decode(payload)
              if len(raw)!=56088 or raw[:4]!=b'RIFF' or raw[8:12]!=b'WEBP':
                  continue
              try:
                  im=Image.open(io.BytesIO(raw)); im.load()
                  good.append((ch,raw,im.size,im.mode))
              except Exception:
                  pass
          if len(good)!=1:
              raise RuntimeError(f'Expected one decodable boundary insertion, found {[(x[0],x[2],x[3]) for x in good]}')
          ch,raw,size,mode=good[0]
          im=Image.open(io.BytesIO(raw)).convert('RGB')
          w,h=im.size
          # Use exact historical CSS grid cell: top-right quarter.
          crop=im.crop((round(w*3/4),0,w,round(h/2)))
          outdir=Path('.work/candidates'); outdir.mkdir(parents=True,exist_ok=True)
          out=outdir/'suspect-4-history.jpg'
          crop.save(out,'JPEG',quality=95,optimize=True)
          data=out.read_bytes()
          meta=outdir/'suspect-4-history.txt'
          meta.write_text(
              f'source_commit={commit}\ninsert_position=after_part1\ninserted_base64_char={ch}\n'
              f'recovered_webp_bytes={len(raw)}\nrecovered_webp_sha256={hashlib.sha256(raw).hexdigest()}\n'
              f'recovered_dimensions={w}x{h}\ncandidate_dimensions={crop.width}x{crop.height}\n'
              f'candidate_bytes={len(data)}\ncandidate_sha256={hashlib.sha256(data).hexdigest()}\n',encoding='utf-8')
          print(meta.read_text())
          PY
      - name: Commit candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .work/candidates/suspect-4-history.jpg .work/candidates/suspect-4-history.txt
          git commit -m "Recover historical suspect-4 candidate"
          git push
